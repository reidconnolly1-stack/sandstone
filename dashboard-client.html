<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard · Sandstone Growth Advisors</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1520; --bg-card:#0F1E2D; --bg-hover:#142233;
  --border:rgba(200,169,126,0.18); --border-lt:rgba(200,169,126,0.09);
  --white:#F0EDE8; --muted:#7A9BB5; --faint:rgba(200,169,126,0.06);
  --sand:#C8A97E; --sand-lt:#E8D5B7; --sand-bg:rgba(200,169,126,0.10);
  --teal:#2E7DA8; --seafoam:#A8D5E2;
  --green:#4ADE80; --green-bg:rgba(74,222,128,0.10);
  --red:#F87171; --red-bg:rgba(248,113,113,0.10);
  --yellow:#FBBF24; --yellow-bg:rgba(251,191,36,0.10);
  --blue:#5BA3C9; --blue-bg:rgba(91,163,201,0.12);
  --purple:#A78BFA; --purple-bg:rgba(167,139,250,0.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased}

/* NAV */
.nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 3%;height:54px;background:rgba(10,21,32,0.96);border-bottom:1px solid var(--border-lt);backdrop-filter:blur(16px)}
.nav-left{display:flex;align-items:center;gap:14px}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--sand-lt);letter-spacing:.04em;text-decoration:none}
.nav-logo em{color:var(--sand);font-style:normal}
.nav-badge{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(46,125,168,.3);padding:3px 9px}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-user{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.nav-avatar{width:28px;height:28px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:600;color:var(--bg);flex-shrink:0}
.nav-logout{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-logout:hover{color:var(--sand)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border-lt);padding:0 3%;background:rgba(10,21,32,.7);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--white)}
.tab.active{color:var(--sand);border-bottom-color:var(--sand)}

/* PANELS */
.panel{display:none;padding:2rem 3%;animation:pIn .25s ease}
.panel.active{display:block}
@keyframes pIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* PAGE HEADER */
.ph{margin-bottom:1.8rem}
.ph-eyebrow{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph-eyebrow::before{content:'';width:20px;height:1px;background:var(--sand)}
.ph-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:300;color:var(--white);line-height:1.1}
.ph-title em{font-style:italic;color:var(--seafoam)}
.ph-rule{width:40px;height:2px;background:var(--sand);margin:10px 0}
.ph-sub{font-size:.82rem;color:var(--muted);font-weight:300;line-height:1.7}

/* GRID LAYOUTS */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:1.5rem}

/* STAT CARD */
.sc{background:var(--bg-card);border:1px solid var(--border-lt);padding:14px 16px;position:relative;overflow:hidden;transition:border-color .2s}
.sc:hover{border-color:var(--border)}
.sc-bar{position:absolute;top:0;left:0;width:3px;height:100%}
.sc-lbl{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.sc-val{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:var(--white);line-height:1}
.sc-sub{font-size:.65rem;color:var(--muted);margin-top:4px}
.sc-chg{font-size:.65rem;margin-top:4px;display:flex;align-items:center;gap:3px}
.up{color:var(--green)} .dn{color:var(--red)} .nt{color:var(--muted)}

/* CARD */
.card{background:var(--bg-card);border:1px solid var(--border-lt);padding:18px;transition:border-color .2s}
.card:hover{border-color:var(--border)}
.card-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:6px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--white)}
.card-sub{font-size:.65rem;color:var(--muted);letter-spacing:.06em}
.card-action{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand);cursor:pointer;transition:opacity .15s;background:none;border:none;font-family:'DM Sans',sans-serif}
.card-action:hover{opacity:.7}

/* BAR CHART */
.bar-chart{display:flex;gap:6px;align-items:flex-end;height:110px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-fill{width:100%;border-radius:1px 1px 0 0;transition:height .5s ease}
.bar-lbl{font-size:.55rem;color:var(--muted)}

/* AUDIT BAR */
.aud-bar{margin-bottom:9px}
.aud-hdr{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:3px}
.aud-track{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.aud-fill{height:100%;border-radius:3px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--border-lt);text-align:left;font-weight:400}
.tbl td{font-size:.78rem;color:var(--white);padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.03);font-weight:300}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}

/* STATUS BADGES */
.sts{font-size:.56rem;padding:2px 8px;letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.sts.paid{background:var(--green-bg);color:var(--green);border:1px solid rgba(74,222,128,.2)}
.sts.pending{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(251,191,36,.2)}
.sts.overdue{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.sts.active{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(91,163,201,.2)}
.sts.done{background:var(--green-bg);color:var(--green);border:1px solid rgba(74,222,128,.2)}
.sts.review{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(251,191,36,.2)}

/* PROGRESS BAR */
.prog-wrap{margin-bottom:12px}
.prog-hdr{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:4px}
.prog-track{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--blue))}

/* EVENT CARDS */
.ev-card{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--border-lt);margin-bottom:8px;background:var(--bg-card);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.ev-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.ev-card.shoot::before{background:var(--blue)}
.ev-card.appearance::before{background:var(--sand)}
.ev-card.deadline::before{background:var(--red)}
.ev-card.meeting::before{background:var(--green)}
.ev-card.strategy::before{background:var(--purple)}
.ev-card:hover{border-color:var(--border);background:var(--bg-hover)}
.ev-date{text-align:center;min-width:36px;flex-shrink:0}
.ev-mon{font-size:.54rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ev-day{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--sand);line-height:1}
.ev-sep{width:1px;background:var(--border-lt);align-self:stretch;flex-shrink:0}
.ev-content{flex:1;min-width:0}
.ev-name{font-size:.84rem;font-weight:500;color:var(--white);margin-bottom:2px}
.ev-detail{font-size:.7rem;color:var(--muted);line-height:1.5;margin-bottom:5px;font-weight:300}
.ev-tags{display:flex;gap:4px;flex-wrap:wrap}
.ev-tag{font-size:.56rem;padding:1px 7px;letter-spacing:.06em;font-weight:500;text-transform:uppercase}
.ev-tag.shoot{background:var(--blue-bg);color:var(--blue)}
.ev-tag.appearance{background:var(--sand-bg);color:var(--sand)}
.ev-tag.deadline{background:var(--red-bg);color:var(--red)}
.ev-tag.meeting{background:var(--green-bg);color:var(--green)}
.ev-tag.strategy{background:var(--purple-bg);color:var(--purple)}

/* MEETING CARD */
.meet-card{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--border-lt);margin-bottom:8px;background:var(--bg-card);flex-wrap:wrap;transition:border-color .2s}
.meet-card:hover{border-color:var(--border)}
.meet-time-col{text-align:center;min-width:52px;flex-shrink:0}
.meet-hr{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:300;color:var(--sand);line-height:1}
.meet-ampm{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meet-div{width:1px;height:36px;background:var(--border-lt);flex-shrink:0}
.meet-info{flex:1;min-width:120px}
.meet-name{font-size:.84rem;font-weight:500;color:var(--white);margin-bottom:2px}
.meet-detail{font-size:.7rem;color:var(--muted)}
.meet-join{padding:5px 14px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--teal);color:var(--seafoam);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.meet-join:hover{background:var(--teal);color:white}
.meet-join.past{border-color:var(--border-lt);color:var(--muted);cursor:default}
.meet-join.past:hover{background:none;color:var(--muted)}

/* TAX CALCULATOR */
.tax-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tax-input-section{background:var(--bg-card);border:1px solid var(--border-lt);padding:20px}
.tax-results{background:var(--bg-card);border:1px solid var(--border);padding:20px;border-top:3px solid var(--sand)}
.tax-result-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-lt);font-size:.8rem}
.tax-result-row:last-child{border-bottom:none}
.tax-result-lbl{color:var(--muted);font-weight:300}
.tax-result-val{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--white)}
.tax-total-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 0;margin-top:6px}
.tax-total-lbl{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
.tax-total-val{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--sand)}
.tax-qtr{background:var(--sand-bg);border:1px solid var(--border);padding:10px 14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.tax-qtr-lbl{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tax-qtr-val{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--sand)}
.tax-note{font-size:.62rem;color:var(--muted);margin-top:10px;line-height:1.6;font-style:italic}

/* FORM ELEMENTS */
.fi-lbl{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.fi-inp,.fi-sel{width:100%;padding:9px 11px;background:var(--bg-hover);border:1px solid var(--border-lt);color:var(--white);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:300;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;margin-bottom:12px}
.fi-inp:focus,.fi-sel:focus{border-color:var(--sand)}
.fi-inp::placeholder{color:rgba(122,155,181,.3)}
.fi-sel option{background:#0F1E2D}
.fi-group{margin-bottom:2px}
.calc-btn{width:100%;padding:11px;background:var(--sand);color:var(--bg);border:none;font-family:'DM Sans',sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px}
.calc-btn:hover{background:var(--sand-lt)}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg-card);border:1px solid var(--border);color:var(--white);padding:8px 18px;font-size:.75rem;opacity:0;transition:all .3s;z-index:9999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* SCHEDULE FORM */
.sched-form{background:var(--bg-card);border:1px solid var(--border-lt);padding:20px}
.sched-types{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.sched-type{padding:8px;border:1px solid var(--border-lt);cursor:pointer;text-align:center;transition:all .15s;background:var(--bg-hover);font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.sched-type:hover{border-color:var(--border)}
.sched-type.sel{border-color:var(--sand);background:var(--sand-bg);color:var(--sand)}
.time-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px}
.ts{padding:7px 4px;border:1px solid var(--border-lt);font-size:.65rem;color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;background:var(--bg-hover)}
.ts:hover{border-color:var(--border)}
.ts.sel{border-color:var(--sand);background:var(--sand-bg);color:var(--sand)}
.book-btn{width:100%;padding:11px;background:var(--sand);color:var(--bg);border:none;font-family:'DM Sans',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:background .2s}
.book-btn:hover{background:var(--sand-lt)}

/* RESPONSIVE */
@media(max-width:900px){
  .g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  .g2,.g21{grid-template-columns:1fr}
  .tax-wrap{grid-template-columns:1fr}
}
@media(max-width:560px){
  .g4,.g3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>

<nav class="nav">
  <div class="nav-left">
    <a href="index.html" class="nav-logo">Sandstone<em>.</em></a>
    <div class="nav-badge" id="navBadge">Client Dashboard</div>
  </div>
  <div class="nav-right">
    <div class="nav-user">
      <div class="nav-avatar" id="navAvatar">?</div>
      <span id="navName">Loading...</span>
    </div>
    <a href="portal.html" class="nav-logout">Sign out</a>
  </div>
</nav>

<div class="tabs" id="tabBar"></div>

<div id="panels"></div>

<script>
// ── SESSION ──
var session={name:'Demo Client',type:'creator',email:''};
try{
  var s=sessionStorage.getItem('sga_user');
  if(s)session=JSON.parse(s);
}catch(e){}

// Parse URL params
var params=new URLSearchParams(window.location.search);
if(params.get('type'))session.type=params.get('type');
if(params.get('name'))session.name=decodeURIComponent(params.get('name'));

var isCreator=session.type==='creator';
var isBrand=session.type==='brand';

// Update nav
document.getElementById('navName').textContent=session.name;
document.getElementById('navAvatar').textContent=session.name.charAt(0).toUpperCase();
document.getElementById('navBadge').textContent=isCreator?'Creator Dashboard':(session.type==='agency'?'Agency Dashboard':'Brand Dashboard');

// ── TOAST ──
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},3000);
}

// ── TABS ──
var creatorTabs=[
  {id:'overview', icon:'◈', label:'Overview'},
  {id:'analytics',icon:'📊',label:'Analytics'},
  {id:'financials',icon:'💰',label:'Financials'},
  {id:'events',   icon:'📅',label:'Events'},
  {id:'meetings', icon:'🤝',label:'Meetings'},
];
var brandTabs=[
  {id:'overview',  icon:'◈', label:'Overview'},
  {id:'operations',icon:'⚙',label:'Operations'},
  {id:'financials',icon:'💰',label:'Financials'},
  {id:'events',    icon:'📅',label:'Events'},
  {id:'meetings',  icon:'🤝',label:'Meetings'},
];
var TABS=isCreator?creatorTabs:brandTabs;

document.getElementById('tabBar').innerHTML=TABS.map(function(t,i){
  return '<button class="tab'+(i===0?' active':'')+'" id="tab-'+t.id+'" onclick="switchTab(\''+t.id+'\')">'+(t.icon?'<span>'+t.icon+'</span>':'')+t.label+'</button>';
}).join('');

function switchTab(id){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active')});
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  var panel=document.getElementById('panel-'+id);
  if(panel)panel.classList.add('active');
  else buildPanel(id);
}

// ── PANEL BUILDER ──
function buildPanel(id){
  var div=document.createElement('div');
  div.className='panel active';div.id='panel-'+id;
  document.getElementById('panels').appendChild(div);
  if(id==='overview')    div.innerHTML=buildOverview();
  if(id==='analytics')   div.innerHTML=buildAnalytics();
  if(id==='operations')  div.innerHTML=buildOperations();
  if(id==='financials')  div.innerHTML=buildFinancials();
  if(id==='events')      div.innerHTML=buildEvents();
  if(id==='meetings')    div.innerHTML=buildMeetings();
  // init any interactive elements
  if(id==='financials')  initTax();
  if(id==='meetings')    initScheduler();
}

// ── OVERVIEW ──
function buildOverview(){
  if(isCreator) return buildCreatorOverview();
  return buildBrandOverview();
}

function buildCreatorOverview(){return `
<div class="ph">
  <div class="ph-eyebrow">Creator Dashboard</div>
  <h2 class="ph-title">Welcome back, <em>${session.name}</em></h2>
  <div class="ph-rule"></div>
  <p class="ph-sub">Your performance, finances, and schedule — all in one place.</p>
</div>
<div class="g4">
  <div class="sc"><div class="sc-bar" style="background:var(--blue)"></div><div class="sc-lbl">Total Followers</div><div class="sc-val">847K</div><div class="sc-chg up">↑ +44.9K this month</div></div>
  <div class="sc"><div class="sc-bar" style="background:var(--sand)"></div><div class="sc-lbl">YTD Earnings</div><div class="sc-val">$24.6K</div><div class="sc-chg up">↑ +38% vs last year</div></div>
  <div class="sc"><div class="sc-bar" style="background:var(--green)"></div><div class="sc-lbl">Avg Engagement</div><div class="sc-val">4.8%</div><div class="sc-chg nt">→ Above avg</div></div>
  <div class="sc"><div class="sc-bar" style="background:var(--purple)"></div><div class="sc-lbl">Active Projects</div><div class="sc-val">3</div><div class="sc-sub">brand deals</div></div>
</div>
<div class="g2">
  <div class="card">
    <div class="card-hdr"><div class="card-title">Upcoming Events</div><button class="card-action" onclick="switchTab('events')">View all →</button></div>
    ${upcomingEventsHTML()}
  </div>
  <div class="card">
    <div class="card-hdr"><div class="card-title">Recent Activity</div></div>
    ${activityHTML()}
  </div>
</div>
<div class="g2">
  <div class="card">
    <div class="card-hdr"><div class="card-title">Pending Invoices</div><button class="card-action" onclick="switchTab('financials')">View all →</button></div>
    <table class="tbl"><thead><tr><th>Brand</th><th>Amount</th><th>Due</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>Fabletics</td><td style="color:var(--sand);font-family:'Cormorant Garamond',serif;font-size:1rem">$3,500</td><td style="color:var(--muted)">May 15</td><td><span class="sts pending">Pending</span></td></tr>
      <tr><td>Hydrant</td><td style="color:var(--sand);font-family:'Cormorant Garamond',serif;font-size:1rem">$3,700</td><td style="color:var(--muted)">May 22</td><td><span class="sts pending">Pending</span></td></tr>
    </tbody></table>
  </div>
  <div class="card">

function buildBarChart(id,data,labels,colors){
  var el=document.getElementById(id);if(!el)return;
  var max=Math.max.apply(null,data);
  el.innerHTML=data.map(function(v,i){
    var h=Math.round((v/max)*95);
    var c=colors[i%colors.length];
    return`<div class="bar-col"><div class="bar-fill" style="height:${h}%;background:linear-gradient(180deg,${c},${c} 100%);opacity:0.8"></div><div class="bar-lbl">${labels[i]||''}</div></div>`;
  }).join('');
}
function buildDualBarChart(id,d1,d2,labels){
  var el=document.getElementById(id);if(!el)return;
  var max=Math.max.apply(null,d1.concat(d2));
  var bw='calc((100% / '+d1.length+') - 4px)';
  var html='';
  for(var i=0;i<d1.length;i++){
    var h1=Math.round((d1[i]/max)*95),h2=Math.round((d2[i]/max)*95);
    html+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1">
      <div style="display:flex;gap:2px;align-items:flex-end;width:100%;height:100px">
        <div style="flex:1;height:${h1}%;background:#DD2A7B;opacity:.75;border-radius:1px 1px 0 0"></div>
        <div style="flex:1;height:${h2}%;background:#FE2C55;opacity:.75;border-radius:1px 1px 0 0"></div>
      </div>
      <div class="bar-lbl">${labels[i]||''}</div>
    </div>`;
  }
  el.innerHTML=html;
}

// ── TAX CALCULATOR ──
var BRACKETS_SINGLE=[[11600,.10],[47150,.12],[100525,.22],[191950,.24],[243725,.32],[609350,.35],[Infinity,.37]];
var BRACKETS_HOH=[[16550,.10],[63100,.12],[100500,.22],[191950,.24],[243700,.32],[609350,.35],[Infinity,.37]];
var BRACKETS_MFJ=[[23200,.10],[94300,.12],[201050,.22],[383900,.24],[487450,.32],[731200,.35],[Infinity,.37]];
var STD_DED={single:14600,hoh:21900,mfj:29200};

function calcFedTax(taxable,filing){
  var brackets=filing==='single'?BRACKETS_SINGLE:filing==='hoh'?BRACKETS_HOH:BRACKETS_MFJ;
  var tax=0,prev=0;
  for(var i=0;i<brackets.length;i++){
    var limit=brackets[i][0],rate=brackets[i][1];
    if(taxable<=prev)break;
    tax+=(Math.min(taxable,limit)-prev)*rate;
    if(taxable<=limit)break;
    prev=limit;
  }
  return tax;
}

function initTax(){calcTax()}
function calcTax(){
  var income=parseFloat(document.getElementById('tax-income').value)||0;
  var filing=document.getElementById('tax-filing').value;
  var deductions=parseFloat(document.getElementById('tax-deductions').value)||0;
  var retirement=parseFloat(document.getElementById('tax-retirement').value)||0;
  var itype=document.getElementById('tax-type').value;
  if(income<=0){
    document.getElementById('tr-total').textContent='Enter income →';
    ['tr-gross','tr-deductions','tr-taxable','tr-federal','tr-se','tr-effective','tr-qtr'].forEach(function(id){document.getElementById(id).textContent='—'});
    return;
  }
  var selfEmpPortion=itype==='selfemployed'?income:itype==='mixed'?income*0.6:0;
  var seDeductible=selfEmpPortion*0.9235*0.153*0.5;
  var seTax=selfEmpPortion*0.9235*0.153;
  var stdDed=STD_DED[filing]||14600;
  var totalDed=Math.max(stdDed,deductions)+retirement+seDeductible;
  var taxable=Math.max(0,income-totalDed);
  var fedTax=calcFedTax(taxable,filing);
  var totalTax=fedTax+seTax;
  var effectiveRate=income>0?(totalTax/income*100).toFixed(1):0;
  var qtr=totalTax/4;
  function fmt(n){return'$'+Math.round(n).toLocaleString()}
  document.getElementById('tr-gross').textContent=fmt(income);
  document.getElementById('tr-deductions').textContent=fmt(totalDed);
  document.getElementById('tr-taxable').textContent=fmt(taxable);
  document.getElementById('tr-federal').textContent=fmt(fedTax);
  document.getElementById('tr-se').textContent=itype==='w2'?'N/A':fmt(seTax);
  document.getElementById('tr-effective').textContent=effectiveRate+'%';
  document.getElementById('tr-total').textContent=fmt(totalTax);
  document.getElementById('tr-qtr').textContent=fmt(qtr);
}
